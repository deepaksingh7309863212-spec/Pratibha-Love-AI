<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRATIBHA LOVE AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101525;
      color: white;
      text-align: center;
    }
    header {
      padding: 25px 10px;
      background: #1b2540;
    }
    h1 { color: #8b9cff; }
    main { padding: 25px 15px; }
    .chat {
      max-width: 500px;
      margin: 20px auto;

    }
    input {
      width: 85%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      margin: 10px;
    }
    button {
      padding: 13px 25px;
      border: 0;
      border-radius: 10px;
      background: #687cff;
      color: white;
      font-size: 16px;
    }

<body>
  <header>
    <h1>❤️ PRATIBHA LOVE AI</h1>
    <p>Your Free AI Assistant</p>
  </header>

  <main>
    <h2>नमस्ते! आपका स्वागत है।</h2>
    <p>आपका अपना AI Assistant</p>

    <div class="chat">
      <h3>AI Chat</h3>
      <input type="text" placeholder="अपना सवाल लिखें...">
      <button>Send</button>
      <p>AI सेवाएँ जल्द जुड़ेंगी।</p>
